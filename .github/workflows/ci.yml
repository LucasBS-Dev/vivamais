name: Viva+ foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:web
      - run: pnpm export:mobile
      - run: pnpm contracts:generate && git diff --exit-code -- packages/contracts/src/generated.ts
      - run: pnpm audit --audit-level high
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Install real OCR runtime
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - run: bash mvnw --batch-mode --no-transfer-progress verify
        working-directory: backend/demo
        env:
          TEST_NATIVE_OCR: true
      - name: Dependency scan
        run: bash mvnw --batch-mode --no-transfer-progress org.owasp:dependency-check-maven:12.1.8:check -DfailBuildOnCVSS=7 -Dformats=JSON,HTML -DnvdApiKeyEnvironmentVariable=NVD_API_KEY
        working-directory: backend/demo
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start isolated PostgreSQL with an ephemeral credential
        run: |
          senhaBanco=$(openssl rand -hex 24)
          echo "::add-mask::$senhaBanco"
          echo "DATABASE_PASSWORD=$senhaBanco" >> "$GITHUB_ENV"
          POSTGRES_PASSWORD="$senhaBanco" docker run --detach --name viva-postgres \
            --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_DB=vivamais --env POSTGRES_USER=vivamais \
            --env POSTGRES_PASSWORD postgres:17.9-alpine
          for i in $(seq 1 60); do
            docker exec viva-postgres pg_isready -U vivamais -d vivamais && exit 0
            sleep 2
          done
          exit 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm export:mobile
      - name: Generate ephemeral bootstrap credential
        run: |
          senhaContas=$(openssl rand -hex 24)
          echo "::add-mask::$senhaContas"
          echo "E2E_PASSWORD=$senhaContas" >> "$GITHUB_ENV"
      - name: Build API
        run: bash mvnw --batch-mode --no-transfer-progress -DskipTests package
        working-directory: backend/demo
      - name: Install real OCR for browser flows
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Start synthetic API
        run: java -jar backend/demo/target/viva-mais-api-0.1.0-SNAPSHOT.jar > /tmp/viva-api.log 2>&1 &
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/vivamais
          DATABASE_USER: vivamais
          DATABASE_PASSWORD: ${{ env.DATABASE_PASSWORD }}
          SPRING_PROFILES_ACTIVE: bootstrap
          DEMO_BOOTSTRAP_PASSWORD: ${{ env.E2E_PASSWORD }}
          SMS_PROVIDER: LOCAL
          SMS_LOCAL_TEST_ENABLED: true
          SMS_REAL_AUTHORIZED: false
          APP_ENV: test
      - name: Wait for API
        run: for i in $(seq 1 60); do curl --fail --silent http://localhost:8080/actuator/health && exit 0; sleep 2; done; exit 1
      - run: pnpm test:e2e
        env:
          E2E_PASSWORD: ${{ env.E2E_PASSWORD }}
          API_BASE_URL: http://127.0.0.1:8080
